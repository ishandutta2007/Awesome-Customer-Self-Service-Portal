<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
    </filter>
  </defs>

  <style>
    .bg-grid { stroke: rgba(255, 255, 255, 0.04); stroke-width: 1; }
    .title-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 42px; fill: #ffffff; }
    .subtitle-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 17px; fill: #94a3b8; }
    .badge-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 12px; fill: #e2e8f0; }

    /* Keyframe Animations */
    @keyframes floatPill1 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes floatPill2 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-12px); }
    }
    @keyframes floatPill3 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-7px); }
    }
    @keyframes pulseOrb {
      0%, 100% { opacity: 0.35; transform: scale(1); }
      50% { opacity: 0.65; transform: scale(1.15); }
    }
    @keyframes waveFlow {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: 40; }
    }

    .pill-1 { animation: floatPill1 5s ease-in-out infinite; }
    .pill-2 { animation: floatPill2 6s ease-in-out infinite 1s; }
    .pill-3 { animation: floatPill3 5.5s ease-in-out infinite 0.5s; }
    .orb-anim { animation: pulseOrb 7s ease-in-out infinite; transform-origin: center; }
    .animated-line { stroke-dasharray: 6, 6; animation: waveFlow 2s linear infinite; }
  </style>

  <!-- Deep Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />

  <!-- Animated Background Ambient Glows -->
  <circle cx="150" cy="180" r="130" fill="#6366f1" opacity="0.25" filter="url(#softGlow)" class="orb-anim" />
  <circle cx="1050" cy="120" r="140" fill="#06b6d4" opacity="0.2" filter="url(#softGlow)" class="orb-anim" />

  <!-- Grid overlay -->
  <path d="M 0,60 L 1200,60 M 0,120 L 1200,120 M 0,180 L 1200,180 M 0,240 L 1200,240 M 0,300 L 1200,300" class="bg-grid" />
  <path d="M 120,0 L 120,360 M 240,0 L 240,360 M 360,0 L 360,360 M 480,0 L 480,360 M 600,0 L 600,360 M 720,0 L 720,360 M 840,0 L 840,360 M 960,0 L 960,360 M 1080,0 L 1080,360" class="bg-grid" />

  <!-- Dynamic Tech Connectivity Lines (Subtle in background) -->
  <path d="M 180,310 C 350,290 850,330 1020,300" fill="none" stroke="#6366f1" stroke-width="2" opacity="0.4" class="animated-line" />
  <path d="M 220,50 C 420,80 780,20 980,60" fill="none" stroke="#06b6d4" stroke-width="2" opacity="0.3" class="animated-line" />

  <!-- Outer Border -->
  <rect x="1" y="1" width="1198" height="358" rx="15" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" />

  <!-- Header Accent Line -->
  <rect x="0" y="0" width="1200" height="4" rx="2" fill="url(#accentGrad)" />

  <!-- Foreground Title and Content (Clean & High Contrast) -->
  <g transform="translate(60, 0)">
    <!-- Top Meta Tag -->
    <g transform="translate(0, 50)">
      <rect width="265" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <circle cx="16" cy="14" r="5" fill="#10b981" />
      <text x="30" y="19" class="badge-text" fill="#94a3b8">CURATED OPEN-SOURCE &amp; SAAS</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="125" class="title-text">
      Awesome Customer Self-Service Portal
    </text>

    <!-- Subtitle -->
    <text x="0" y="165" class="subtitle-text">
      Enterprise Knowledge Bases, Ticketing Infrastructure, Help Desks &amp; Client Portals
    </text>

    <text x="0" y="193" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14px" fill="#64748b">
      Compare leading SaaS platforms, enterprise valuations, and self-hosted open-source alternatives.
    </text>

    <!-- Interactive / Dynamic Foreground Feature Pills (Elevated & Animated) -->
    <g transform="translate(0, 240)">
      <!-- Pill 1: Knowledge Bases -->
      <g class="pill-1" transform="translate(0, 0)">
        <rect width="240" height="52" rx="12" fill="url(#cardGrad)" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1.5" />
        <circle cx="28" cy="26" r="14" fill="#0369a1" fill-opacity="0.4" />
        <path d="M 23,20 L 33,20 M 23,26 L 33,26 M 23,32 L 29,32" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
        <text x="52" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="13" fill="#ffffff">Smart Knowledge Bases</text>
        <text x="52" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">Instant self-service FAQs</text>
      </g>

      <!-- Pill 2: Ticket Tracking -->
      <g class="pill-2" transform="translate(260, 0)">
        <rect width="240" height="52" rx="12" fill="url(#cardGrad)" stroke="#818cf8" stroke-opacity="0.3" stroke-width="1.5" />
        <circle cx="28" cy="26" r="14" fill="#4338ca" fill-opacity="0.4" />
        <path d="M 22,23 L 26,27 L 34,19" stroke="#818cf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
        <text x="52" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="13" fill="#ffffff">Support &amp; Ticketing</text>
        <text x="52" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">Omnichannel issue tracking</text>
      </g>

      <!-- Pill 3: Self-Hosted & Data Sovereignty -->
      <g class="pill-3" transform="translate(520, 0)">
        <rect width="250" height="52" rx="12" fill="url(#cardGrad)" stroke="#a855f7" stroke-opacity="0.3" stroke-width="1.5" />
        <circle cx="28" cy="26" r="14" fill="#6b21a8" fill-opacity="0.4" />
        <path d="M 24,20 L 32,20 L 32,32 L 24,32 Z" stroke="#c084fc" stroke-width="1.8" fill="none" />
        <path d="M 26,20 L 26,17 C 26,15 30,15 30,17 L 30,20" stroke="#c084fc" stroke-width="1.8" fill="none" />
        <text x="52" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="13" fill="#ffffff">Self-Hosted &amp; Open Source</text>
        <text x="52" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">100% data sovereign portals</text>
      </g>

      <!-- Pill 4: AI Virtual Assistants -->
      <g class="pill-1" transform="translate(790, 0)">
        <rect width="250" height="52" rx="12" fill="url(#cardGrad)" stroke="#10b981" stroke-opacity="0.3" stroke-width="1.5" />
        <circle cx="28" cy="26" r="14" fill="#047857" fill-opacity="0.4" />
        <circle cx="28" cy="26" r="5" stroke="#34d399" stroke-width="2" fill="none" />
        <line x1="28" y1="16" x2="28" y2="19" stroke="#34d399" stroke-width="2" stroke-linecap="round" />
        <line x1="28" y1="33" x2="28" y2="36" stroke="#34d399" stroke-width="2" stroke-linecap="round" />
        <line x1="18" y1="26" x2="21" y2="26" stroke="#34d399" stroke-width="2" stroke-linecap="round" />
        <line x1="35" y1="26" x2="38" y2="26" stroke="#34d399" stroke-width="2" stroke-linecap="round" />
        <text x="52" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="13" fill="#ffffff">AI-Powered Resolution</text>
        <text x="52" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">Zero-touch automated support</text>
      </g>
    </g>
  </g>
</svg>
